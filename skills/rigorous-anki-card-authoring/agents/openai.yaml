version: 1
display_name: Rigorous Anki Card Authoring
short_description: Design and audit small Anki card sections before approved implementation — from study material or from a chosen version of an agile-learning topic model.
default_prompt: Design one small Anki card section at a time using the seven rigorous authoring principles — context independence, minimum information, grounding, importance, connectivity, cloze preference, and controlled redundancy; use the user's preferred or source language and compact, mobile-scannable learner text, with concise natural Chinese when applicable and technical English only when it improves precision or recognition. Sources may be external study material or a chosen version of a guided-concept-learning topic repository — bind every card to its source version (repository, version label, commit, and the section of that version's model it tests), never test content the version's model does not contain, let the carding depth follow the chosen version's depth, and review cards against each new version, keeping unchanged mechanisms, redoing rewritten ones, and retiring removed ones. Provide complete textual card drafts, a detailed 1–7 per-card audit, every concept mentioned, each card's logic chain, and a hostile audit; then wait for explicit user confirmation before editing scripts or creating an APKG. After approval, use the existing 9-field contract and the repository generation patterns.
