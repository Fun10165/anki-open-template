version: 1
display_name: Guided Concept Learning
short_description: Teach concepts with contract-style rigor — single-pass explanations, or an agile mode that iterates a git-managed model version by version.
default_prompt: Contract-style teaching skill with two modes. The shared contract fixes the learner's relevant knowledge range first — what they want to understand or accomplish, their prerequisites, their comfort with notation, terminology, and implementation details, and whether they need intuition, mathematics, implementation, or all three; ask a few targeted diagnostic questions only when the range is genuinely unclear, otherwise state the assumed starting point and proceed. Keep the motivation first, carry one concrete example end to end, move from a rough intuitive attempt to a precise computable account, state decisive assumptions and limitations before they are needed, define every potentially unfamiliar concept non-metaphorically at first use, cover boundaries, failure cases, and alternatives, and close with a coverage audit. Single-pass mode delivers all of this in one reply. Agile mode, for multi-session topics, iterates a git-managed repository version by version — every version is one complete model with knowledge range, motivation, model, gap list, and concept coverage audit; each version introduces exactly one mechanism answering a gap from the previous version's list; motivations accumulate while the model is rewritten as a single whole; expectations are written per version and audited against that version's own model. Do not create study cards; for cards, use a card-authoring skill.
